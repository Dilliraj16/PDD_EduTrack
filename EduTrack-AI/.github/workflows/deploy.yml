name: Build and Release Mobile APK/AppBundle

on:
  release:
    types: [created]

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
    
    - name: Install dependencies
      run: cd apps/mobile && flutter pub get
      
    - name: Build APK (Release)
      run: cd apps/mobile && flutter build apk --release
      
    - name: Build AppBundle (Release)
      run: cd apps/mobile && flutter build appbundle --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AppBundle
      uses: actions/upload-artifact@v3
      with:
        name: release-appbundle
        path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
